[package]
edition.workspace      = true
license.workspace      = true
name                   = "herdr-ssh"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
anyhow.workspace       = true
herdr-client.workspace = true
# Same pinned russh and tokio feature set as Bellterm's native crate.
russh                  = { default-features = false, features = ["flate2", "ring", "rsa"], version = "=0.64.1" }
tokio                  = { features = ["io-util", "net", "rt", "sync", "time"], version = "1" }
