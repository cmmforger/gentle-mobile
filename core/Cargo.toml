[package]
edition.workspace      = true
license.workspace      = true
name                   = "gentlecompanion-core"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true
description            = "Gentle Companion transport core: SSH transport, host-key pinning, liveness, reconnect."

[lints]
workspace = true

[dependencies]
anyhow.workspace       = true
base64.workspace       = true
crossbeam-channel.workspace = true
herdr-client.workspace = true
# The request lane speaks the vendored protocol directly (the vendored client
# only offers its closed `Method` enum).
herdr-protocol.workspace = true
# Same pinned russh and tokio feature set as the SSH spike and Bellterm's native crate.
russh                  = { default-features = false, features = ["flate2", "ring", "rsa"], version = "=0.64.1" }
serde_json.workspace   = true
thiserror.workspace    = true
tokio                  = { features = ["io-util", "net", "rt", "sync"], version = "1" }
# The UniFFI surface: proc-macro scaffolding in the lib, plus the `cli`
# feature that `src/bin/uniffi-bindgen.rs` needs — the bindgen binary lives in
# this crate, so the generator version always matches the scaffolding version.
uniffi                 = { version = "0.32", features = ["cli"] }
# Renderer-only width classification for surface cells (same crate the T4
# spike used); the version is pinned by the existing Cargo.lock entry.
unicode-width          = "0.2"

[lib]
crate-type = ["cdylib", "lib"]

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "connect"
